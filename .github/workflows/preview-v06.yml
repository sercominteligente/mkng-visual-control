name: Preview v0.6

on:
  push:
    branches:
      - feature/v0.6-pricing-intelligence
    paths:
      - "src/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/preview-v06.yml"

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar credenciais Cloudflare
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN ausente"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID ausente"; exit 1; }
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Confirmar Secret OpenAI no Worker
        shell: bash
        run: |
          set -o pipefail
          npx wrangler secret list 2>&1 | tee secret-list.log
          grep -q "OPENAI_API_KEY" secret-list.log || { echo "::error::OPENAI_API_KEY não encontrado no Worker Cloudflare"; exit 1; }
          echo "OPENAI_API_KEY confirmado no Worker. Valor permanece oculto."
      - name: Build
        run: npm run build
      - name: Upload da versão de preview
        shell: bash
        run: |
          set -o pipefail
          npx wrangler versions upload --preview-alias v06-homolog --keep-vars --message "Homologação MKNG v0.6" 2>&1 | tee preview-upload.log
      - name: Smoke test do preview
        shell: bash
        run: |
          PREVIEW_URL=$(grep -o 'https://v06-homolog[^[:space:]]*' preview-upload.log | tail -n 1)
          test -n "$PREVIEW_URL" || { echo "::error::URL de preview não encontrada"; exit 1; }
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "$PREVIEW_URL/" >/dev/null
          echo "Preview respondeu HTTP com sucesso: $PREVIEW_URL"
      - name: Resumo
        if: always()
        shell: bash
        run: |
          echo "### MKNG v0.6 Preview" >> "$GITHUB_STEP_SUMMARY"
          if [ -f secret-list.log ]; then
            echo "- Secret OPENAI_API_KEY: verificado pelo Wrangler" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f preview-upload.log ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 40 preview-upload.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
